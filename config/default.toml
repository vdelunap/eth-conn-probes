[run]
attempts     = 3
min_successes = 1
timeout_ms   = 5000
parallelism  = 16

[client]
# location_label is informational only; the server derives actual location from IP.
location_label = ""
app_channel    = "cli"
client_id      = ""

[reporting]
enabled    = true
# TODO: replace with real server IP once deployed to DigitalOcean
report_url = "http://146.146.146.146:8080/report"
timeout_ms = 5000

[probes.control_http]
# Disabled until the server is deployed.
enabled      = false
url          = "http://146.146.146.146:8080/ping"
expect_body  = "ok"

# ---------------------------------------------------------------------------
# TCP targets — each entry generates a DNS resolve probe AND a TCP connect
# probe automatically.  All providers use port 443 (HTTPS/TLS).
# ---------------------------------------------------------------------------

[[probes.tcp]]
name = "publicnode"
host = "ethereum-rpc.publicnode.com"
port = 443

[[probes.tcp]]
name = "cloudflare"
host = "cloudflare-eth.com"
port = 443

[[probes.tcp]]
name = "llamarpc"
host = "eth.llamarpc.com"
port = 443

[[probes.tcp]]
name = "drpc"
host = "eth.drpc.org"
port = 443

[[probes.tcp]]
name = "flashbots"
host = "rpc.flashbots.net"
port = 443

[[probes.tcp]]
name = "1rpc"
host = "1rpc.io"
port = 443

[[probes.tcp]]
name = "mevblocker"
host = "rpc.mevblocker.io"
port = 443

[[probes.tcp]]
name = "blast"
host = "eth-mainnet.public.blastapi.io"
port = 443

# ---------------------------------------------------------------------------
# HTTPS JSON-RPC — sends eth_chainId and checks the response has a "result".
# ---------------------------------------------------------------------------

[[probes.https_jsonrpc]]
name   = "publicnode"
url    = "https://ethereum-rpc.publicnode.com"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "cloudflare"
url    = "https://cloudflare-eth.com"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "llamarpc"
url    = "https://eth.llamarpc.com"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "drpc"
url    = "https://eth.drpc.org"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "flashbots"
url    = "https://rpc.flashbots.net"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "1rpc"
url    = "https://1rpc.io/eth"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "mevblocker"
url    = "https://rpc.mevblocker.io"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "blast"
url    = "https://eth-mainnet.public.blastapi.io"
method = "eth_chainId"

# ---------------------------------------------------------------------------
# WSS JSON-RPC — only providers with confirmed public WebSocket endpoints.
# ---------------------------------------------------------------------------

[[probes.wss_jsonrpc]]
name   = "publicnode"
url    = "wss://ethereum-rpc.publicnode.com"
method = "eth_chainId"

[[probes.wss_jsonrpc]]
name   = "drpc"
url    = "wss://eth.drpc.org"
method = "eth_chainId"

# ---------------------------------------------------------------------------
# P2P boot nodes — TCP connect to port 30303 (RLPx + DiscV5).
# If this port is blocked while 443 works → selective Ethereum P2P censorship.
# Source: go-ethereum params/bootnodes.go (mainnet MainnetBootnodes).
# ---------------------------------------------------------------------------

[[probes.p2p_boot_nodes]]
name = "EF-ap-southeast"
host = "18.138.108.67"
port = 30303

[[probes.p2p_boot_nodes]]
name = "EF-us-east"
host = "3.209.45.79"
port = 30303

# Previously EF-southeast-asia (52.187.207.27, AWS): node moved to Hetzner Helsinki.
[[probes.p2p_boot_nodes]]
name = "EF-hetzner-hel"
host = "65.108.70.101"
port = 30303

[[probes.p2p_boot_nodes]]
name = "EF-hetzner-fsn"
host = "157.90.35.166"
port = 30303

# ---------------------------------------------------------------------------
# RLPx targets — ECIES auth handshake to execution boot nodes on TCP:30303.
# Requires the rlpx Cargo feature.  The enode:// URL embeds the 64-byte
# secp256k1 public key needed for ECIES encryption of the auth message.
# IPs and pubkeys are Ethereum Foundation boot nodes (go-ethereum bootnodes.go).
# ---------------------------------------------------------------------------

[[probes.rlpx_targets]]
name  = "EF-ap-southeast"
enode = "enode://d860a01f9722d78051619d1e2351aba3f43f943f6f00718d1b9baa4101932a1f5011f16bb2b1bb35db20d6fe28fa0bf09636d26a87d31de9ec6203eeedb1f666@18.138.108.67:30303"

[[probes.rlpx_targets]]
name  = "EF-us-east"
enode = "enode://22a8232c3abc76a16ae9d6c3b164f98775fe226f0917b0ca871128a74a8e9630b458460865bab457221f1d448dd9791d24c4e5d88786180ac185df813a68d4de@3.209.45.79:30303"

# Same pubkey as former EF-southeast-asia; node relocated to Hetzner Helsinki.
[[probes.rlpx_targets]]
name  = "EF-hetzner-hel"
enode = "enode://2b252ab6a1d0f971d9722cb839a42cb81db019ba44c08754628ab4a823487071b5695317c8ccd085219c3a03af063495b2f1da8d18218da2d6a82981b45e6ffc@65.108.70.101:30303"

[[probes.rlpx_targets]]
name  = "EF-hetzner-fsn"
enode = "enode://4aeb4ab6c14b23e2c4cfdce879c04b0748a20d8e9b59e25ded2a08143e265c6c25936e74cbc8e641e3312ca288673d91f2f93f8e277de3cfa444ecdaaf982052@157.90.35.166:30303"

# ---------------------------------------------------------------------------
# DNS comparison — system resolver vs Cloudflare DoH (1.1.1.1).
# System returns nothing but DoH succeeds → DNS block suspected.
# ---------------------------------------------------------------------------

[[probes.dns_compare]]
name = "publicnode"
host = "ethereum-rpc.publicnode.com"

[[probes.dns_compare]]
name = "cloudflare"
host = "cloudflare-eth.com"

[[probes.dns_compare]]
name = "llamarpc"
host = "eth.llamarpc.com"

[[probes.dns_compare]]
name = "drpc"
host = "eth.drpc.org"

[[probes.dns_compare]]
name = "beacon-publicnode"
host = "ethereum-beacon-api.publicnode.com"

[[probes.dns_compare]]
name = "beacon-chainsafe"
host = "lodestar-mainnet.chainsafe.io"

# ---------------------------------------------------------------------------
# DiscV4 execution — UDP ping to execution boot nodes on port 30303.
# Tests discv4 peer discovery separately from TCP reachability.
# Same IPs as p2p_boot_nodes.  TCP blocked + UDP open = selective TCP block.
# UDP blocked = execution P2P discovery is fully unreachable.
# ---------------------------------------------------------------------------

[[probes.discv4_execution]]
name = "EF-ap-southeast"
host = "18.138.108.67"
port = 30303

[[probes.discv4_execution]]
name = "EF-us-east"
host = "3.209.45.79"
port = 30303

[[probes.discv4_execution]]
name = "EF-hetzner-hel"
host = "65.108.70.101"
port = 30303

[[probes.discv4_execution]]
name = "EF-hetzner-fsn"
host = "157.90.35.166"
port = 30303

# ---------------------------------------------------------------------------
# DiscV5 consensus — ping consensus boot nodes via DiscV5 v5.
# Consensus nodes publish ENRs with enr:- format, unlike execution nodes
# which use enode:// (devp2p v4) and cannot be reached by DiscV5 v5.
# ENRs with tcp4 also generate Beacon TCP + libp2p handshake probes.
# ENRs without tcp4 fall back to the udp4 port for TCP probes.
# ---------------------------------------------------------------------------

# Teku (ConsenSys) — tcp4=9000 advertised; TCP:9000 firewalled (discovery-only boot nodes).
# See DESIGN.md §11.4b for all evaluated candidates and removal rationale.
[[probes.discv5_consensus]]
name = "teku-aws-ohio"
enr  = "enr:-Iu4QLm7bZGdAt9NSeJG0cEnJohWcQTQaI9wFLu3Q7eHIDfrI4cwtzvEW3F3VbG9XdFXlrHyFGeXPn9snTCQJ9bnMRABgmlkgnY0gmlwhAOTJQCJc2VjcDI1NmsxoQIZdZD6tDYpkpEfVo5bgiU8MGRjhcOmHGD2nErK0UKRrIN0Y3CCIyiDdWRwgiMo"

[[probes.discv5_consensus]]
name = "teku-aws-sydney"
enr  = "enr:-Iu4QEDJ4Wa_UQNbK8Ay1hFEkXvd8psolVK6OhfTL9irqz3nbXxxWyKwEplPfkju4zduVQj6mMhUCm9R2Lc4YM5jPcIBgmlkgnY0gmlwhANrfESJc2VjcDI1NmsxoQJCYz2-nsqFpeEj6eov9HSi9QssIVIVNr0I89J1vXM9foN0Y3CCIyiDdWRwgiMo"

# Nimbus (Status) — tcp4=9100 (Prometheus metrics, not libp2p); DiscV5 OK.
[[probes.discv5_consensus]]
name = "nimbus-frankfurt"
enr  = "enr:-LK4QA8FfhaAjlb_BXsXxSfiysR7R52Nhi9JBt4F8SPssu8hdE1BXQQEtVDC3qStCW60LSO7hEsVHv5zm8_6Vnjhcn0Bh2F0dG5ldHOIAAAAAAAAAACEZXRoMpC1MD8qAAAAAP__________gmlkgnY0gmlwhAN4aBKJc2VjcDI1NmsxoQJerDhsJ-KxZ8sHySMOCmTO6sHM3iCFQ6VMvLTe948MyYN0Y3CCI4yDdWRwgiOM"

# ---------------------------------------------------------------------------
# Beacon HTTPS — GET /eth/v1/node/version on public beacon REST API nodes.
# Tests whether consensus-layer data is reachable over HTTPS (port 443).
# Uses providers with confirmed public endpoints that require no API key.
# ---------------------------------------------------------------------------

[[probes.beacon_https]]
name = "publicnode"
url  = "https://ethereum-beacon-api.publicnode.com"

[[probes.beacon_https]]
name = "chainsafe-lodestar"
url  = "https://lodestar-mainnet.chainsafe.io"
