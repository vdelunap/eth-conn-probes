[run]
attempts     = 3
min_successes = 1
timeout_ms   = 5000
parallelism  = 16

[client]
network_label = ""
app_channel    = "cli"
client_id      = ""

[reporting]
enabled    = true
report_url = "http://46.101.227.140:8000/report"
timeout_ms = 5000

# Off by default: this only checks that the collector itself is up, which is
# noise unless you are debugging the collector.
[probes.control_http]
enabled      = false
url          = "http://46.101.227.140:8000/ping"
expect_body  = "ok"

# ---------------------------------------------------------------------------
# TCP targets: each entry expands into dns_resolve + tcp_connect + tls_handshake.
# All providers are on 443.
# ---------------------------------------------------------------------------

[[probes.tcp]]
name = "publicnode"
host = "ethereum-rpc.publicnode.com"
port = 443

[[probes.tcp]]
name = "cloudflare"
host = "cloudflare-eth.com"
port = 443

[[probes.tcp]]
name = "llamarpc"
host = "eth.llamarpc.com"
port = 443

[[probes.tcp]]
name = "drpc"
host = "eth.drpc.org"
port = 443

[[probes.tcp]]
name = "flashbots"
host = "rpc.flashbots.net"
port = 443

[[probes.tcp]]
name = "1rpc"
host = "1rpc.io"
port = 443

[[probes.tcp]]
name = "mevblocker"
host = "rpc.mevblocker.io"
port = 443

[[probes.tcp]]
name = "blast"
host = "eth-mainnet.public.blastapi.io"
port = 443

# ---------------------------------------------------------------------------
# HTTPS JSON-RPC. Expands into https_json_rpc + https_json_rpc_write.
# ---------------------------------------------------------------------------

[[probes.https_jsonrpc]]
name   = "publicnode"
url    = "https://ethereum-rpc.publicnode.com"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "cloudflare"
url    = "https://cloudflare-eth.com"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "llamarpc"
url    = "https://eth.llamarpc.com"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "drpc"
url    = "https://eth.drpc.org"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "flashbots"
url    = "https://rpc.flashbots.net"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "1rpc"
url    = "https://1rpc.io/eth"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "mevblocker"
url    = "https://rpc.mevblocker.io"
method = "eth_chainId"

[[probes.https_jsonrpc]]
name   = "blast"
url    = "https://eth-mainnet.public.blastapi.io"
method = "eth_chainId"

# ---------------------------------------------------------------------------
# WSS JSON-RPC. Expands into wss_json_rpc + wss_subscribe.
# Only the providers with a confirmed public WebSocket endpoint.
# ---------------------------------------------------------------------------

[[probes.wss_jsonrpc]]
name   = "publicnode"
url    = "wss://ethereum-rpc.publicnode.com"
method = "eth_chainId"

[[probes.wss_jsonrpc]]
name   = "drpc"
url    = "wss://eth.drpc.org"
method = "eth_chainId"

# ---------------------------------------------------------------------------
# P2P boot nodes: TCP connect to 30303. Blocked here but open on 443 means
# Ethereum P2P is being singled out.
# Source: go-ethereum params/bootnodes.go (MainnetBootnodes).
# ---------------------------------------------------------------------------

[[probes.p2p_boot_nodes]]
name = "EF-ap-southeast"
host = "18.138.108.67"
port = 30303

[[probes.p2p_boot_nodes]]
name = "EF-us-east"
host = "3.209.45.79"
port = 30303

# Previously EF-southeast-asia (52.187.207.27, AWS): node moved to Hetzner Helsinki.
[[probes.p2p_boot_nodes]]
name = "EF-hetzner-hel"
host = "65.108.70.101"
port = 30303

[[probes.p2p_boot_nodes]]
name = "EF-hetzner-fsn"
host = "157.90.35.166"
port = 30303

# ---------------------------------------------------------------------------
# RLPx targets: ECIES auth handshake on TCP:30303. Needs the rlpx feature.
# Same nodes as above, but as enode:// URLs: ECIES needs the 64-byte secp256k1
# pubkey that the enode carries and a bare host:port does not.
# ---------------------------------------------------------------------------

[[probes.rlpx_targets]]
name  = "EF-ap-southeast"
enode = "enode://d860a01f9722d78051619d1e2351aba3f43f943f6f00718d1b9baa4101932a1f5011f16bb2b1bb35db20d6fe28fa0bf09636d26a87d31de9ec6203eeedb1f666@18.138.108.67:30303"

[[probes.rlpx_targets]]
name  = "EF-us-east"
enode = "enode://22a8232c3abc76a16ae9d6c3b164f98775fe226f0917b0ca871128a74a8e9630b458460865bab457221f1d448dd9791d24c4e5d88786180ac185df813a68d4de@3.209.45.79:30303"

# Same pubkey as former EF-southeast-asia; node relocated to Hetzner Helsinki.
[[probes.rlpx_targets]]
name  = "EF-hetzner-hel"
enode = "enode://2b252ab6a1d0f971d9722cb839a42cb81db019ba44c08754628ab4a823487071b5695317c8ccd085219c3a03af063495b2f1da8d18218da2d6a82981b45e6ffc@65.108.70.101:30303"

[[probes.rlpx_targets]]
name  = "EF-hetzner-fsn"
enode = "enode://4aeb4ab6c14b23e2c4cfdce879c04b0748a20d8e9b59e25ded2a08143e265c6c25936e74cbc8e641e3312ca288673d91f2f93f8e277de3cfa444ecdaaf982052@157.90.35.166:30303"

# ---------------------------------------------------------------------------
# DNS comparison: system resolver vs Cloudflare DoH. DoH resolving what the
# system resolver won't points at a DNS block.
# ---------------------------------------------------------------------------

[[probes.dns_compare]]
name = "publicnode"
host = "ethereum-rpc.publicnode.com"

[[probes.dns_compare]]
name = "cloudflare"
host = "cloudflare-eth.com"

[[probes.dns_compare]]
name = "llamarpc"
host = "eth.llamarpc.com"

[[probes.dns_compare]]
name = "drpc"
host = "eth.drpc.org"

[[probes.dns_compare]]
name = "beacon-publicnode"
host = "ethereum-beacon-api.publicnode.com"

[[probes.dns_compare]]
name = "beacon-chainsafe"
host = "lodestar-mainnet.chainsafe.io"

# ---------------------------------------------------------------------------
# DiscV4 execution: UDP ping to the same IPs as p2p_boot_nodes, to separate
# peer discovery from plain TCP reachability. Needs the discv4 feature.
# ---------------------------------------------------------------------------

[[probes.discv4_execution]]
name = "EF-ap-southeast"
host = "18.138.108.67"
port = 30303

[[probes.discv4_execution]]
name = "EF-us-east"
host = "3.209.45.79"
port = 30303

[[probes.discv4_execution]]
name = "EF-hetzner-hel"
host = "65.108.70.101"
port = 30303

[[probes.discv4_execution]]
name = "EF-hetzner-fsn"
host = "157.90.35.166"
port = 30303

# ---------------------------------------------------------------------------
# DiscV5 consensus: UDP:9000 pings, discv5 feature. These ENRs produce pings
# and nothing else: the beacon TCP and libp2p targets come from live Beacon API
# peers at runtime instead (beacon_peers::fetch_all).
# ---------------------------------------------------------------------------

# Teku advertises tcp4=9000 but firewalls it, so these are discovery-only nodes.
[[probes.discv5_consensus]]
name = "teku-aws-ohio"
enr  = "enr:-Iu4QLm7bZGdAt9NSeJG0cEnJohWcQTQaI9wFLu3Q7eHIDfrI4cwtzvEW3F3VbG9XdFXlrHyFGeXPn9snTCQJ9bnMRABgmlkgnY0gmlwhAOTJQCJc2VjcDI1NmsxoQIZdZD6tDYpkpEfVo5bgiU8MGRjhcOmHGD2nErK0UKRrIN0Y3CCIyiDdWRwgiMo"

[[probes.discv5_consensus]]
name = "teku-aws-sydney"
enr  = "enr:-Iu4QEDJ4Wa_UQNbK8Ay1hFEkXvd8psolVK6OhfTL9irqz3nbXxxWyKwEplPfkju4zduVQj6mMhUCm9R2Lc4YM5jPcIBgmlkgnY0gmlwhANrfESJc2VjcDI1NmsxoQJCYz2-nsqFpeEj6eov9HSi9QssIVIVNr0I89J1vXM9foN0Y3CCIyiDdWRwgiMo"

# Nimbus advertises tcp4=9100, which is Prometheus rather than libp2p. DiscV5 works.
[[probes.discv5_consensus]]
name = "nimbus-frankfurt"
enr  = "enr:-LK4QA8FfhaAjlb_BXsXxSfiysR7R52Nhi9JBt4F8SPssu8hdE1BXQQEtVDC3qStCW60LSO7hEsVHv5zm8_6Vnjhcn0Bh2F0dG5ldHOIAAAAAAAAAACEZXRoMpC1MD8qAAAAAP__________gmlkgnY0gmlwhAN4aBKJc2VjcDI1NmsxoQJerDhsJ-KxZ8sHySMOCmTO6sHM3iCFQ6VMvLTe948MyYN0Y3CCI4yDdWRwgiOM"

# ---------------------------------------------------------------------------
# Beacon HTTPS: GET /eth/v1/node/version, i.e. consensus data over 443.
# These endpoints are public and need no API key. They double as the source of
# live peers for the beacon TCP and libp2p probes.
# ---------------------------------------------------------------------------

[[probes.beacon_https]]
name = "publicnode"
url  = "https://ethereum-beacon-api.publicnode.com"

[[probes.beacon_https]]
name = "chainsafe-lodestar"
url  = "https://lodestar-mainnet.chainsafe.io"
